<svg xmlns="http://www.w3.org/2000/svg" width="650" height="390" viewBox="0 0 650 390" role="img">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
    .title { font-size: 20px; font-weight: 700; }
    .state { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; rx: 22; }
    .start { fill: #0f172a; }
    .edge { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .label { font-size: 12px; fill: #334155; }
    .small { font-size: 11px; fill: #64748b; }
  </style>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="34" class="title">Stavový automat registrace</text>
<circle cx="45" cy="150" r="10" class="start"/>
<path d="M 55 150 C 100 150, 100 90, 145 90" class="edge"/>
<path d="M 55 150 C 100 150, 100 230, 145 230" class="edge"/>
<text x="67" y="105" class="label">cena 0</text>
<text x="67" y="265" class="label">cena &gt; 0</text>
<rect x="150" y="55" width="150" height="70" rx="20" class="state"/>
<text x="225" y="95" text-anchor="middle" font-weight="700">confirmed</text>
<rect x="150" y="195" width="150" height="70" rx="20" class="state"/>
<text x="225" y="235" text-anchor="middle" font-weight="700">pending</text>
<rect x="430" y="195" width="150" height="70" rx="20" class="state"/>
<text x="505" y="235" text-anchor="middle" font-weight="700">cancelled</text>

<path d="M 300 195 L 300 130" class="edge"/>
<text x="310" y="162" class="label">správce potvrdí</text>
<path d="M 300 230 L 425 230" class="edge"/>
<text x="362" y="218" text-anchor="middle" class="label">správce odmítne</text>
<path d="M 300 90 C 390 90, 420 155, 440 190" class="edge"/>
<text x="350" y="80" class="label">zrušit</text>
<path d="M 430 255 C 350 300, 300 300, 245 267" class="edge"/>
<text x="337" y="312" text-anchor="middle" class="label">nová registrace</text>
<text x="30" y="350" class="small">Registrace se znovu použije i po zrušení; historie se nezachovává. Aktivní jsou pending a confirmed.</text>
<text x="30" y="368" class="small">Při obnovení platí cena 0 → confirmed, cena &gt; 0 → pending s novým VS; zrušit může i uživatel.</text>
</svg>
