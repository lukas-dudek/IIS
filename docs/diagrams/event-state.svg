<path d="M 505 150 C 480 105, 430 105, 405 140" class="edge"/>
<text x="455" y="135" class="label">podstatná změna</text>
<text x="30" y="380" class="small">Stav finished neexistuje: ukončení se odvozuje z ends_at &lt; now. Přechody provádí EventService v transakci.</text>

</svg>
